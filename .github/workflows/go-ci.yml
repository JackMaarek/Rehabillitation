name: Lint, Build & Tests - Go

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'taskAPI/**'
  pull_request:
    branches: [ main, dev ]

jobs:
  build-backend:
    name: Build
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    strategy:
      matrix:
        dir: [ "./taskAPI" ]

    steps:
      - name: Set up Go 1.24
        uses: actions/setup-go@v4
        with:
          go-version: 1.24
        id: go

      - name: Check out code
        uses: actions/checkout@v3

      - name: Lint with golangci
        uses: golangci/golangci-lint-action@v2.5.2
        with:
          working-directory: ${{ matrix.dir }}
          skip-go-installation: true

      - name: Download dependencies
        working-directory: ${{ matrix.dir }}
        run: go mod download

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: go build -v .

      # Uncomment when tests are available
      #- name: Test
      #  working-directory: ${{ matrix.dir }}
      #  run: go test -v ./...
