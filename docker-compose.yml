version: '3'

services:
  task_api:
    build:
      context: taskAPI
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: on-failure
    volumes:
      - ./taskAPI:/go/src/github.com/JackMaarek/Rehabillitation
    depends_on:
      - postgres
    networks:
      - backend

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DATABASE_HOST=${DB_HOST}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend

  adminer:
    image: adminer
    ports:
      - "3000:8080"
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

volumes:
  api:
  postgres:

  # Networks to be created to facilitate communication between containers
networks:
  backend:
    driver: bridge
